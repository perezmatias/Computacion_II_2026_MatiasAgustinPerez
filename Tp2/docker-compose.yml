services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      WORKERS: ${WORKERS:-3}
      POOL_PROCESSES: ${POOL_PROCESSES:-2}
      QUEUE_MAXSIZE: ${QUEUE_MAXSIZE:-1000}
      DEFAULT_TIMEOUT: ${DEFAULT_TIMEOUT:-30}
      SHUTDOWN_GRACE: ${SHUTDOWN_GRACE:-10}
      HASH_MODE: ${HASH_MODE:-executor} 
      DUMP_DIR: /data
    volumes:
      - ./data:/data                       
    stop_grace_period: 20s
    depends_on:
      - mock

  mock:                                    
    build: .
    command: ["python", "-m", "src.mock_server"]
    ports:
      - "9000:9000"
